name: AgentGuard Hath0r Compliance & Quality Gates

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  hath0r_quality_gates:
    name: Hath0r Agentic Framework Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install AgentGuard & Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e .

      - name: Gate 1-5: Execute Hath0r Quality Gates Suite
        run: |
          python -m agentguard quality-gate

      - name: Verify Release Build Package Artifacts
        run: |
          python scripts/build.py
          ls -la release/python/cli/
