apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentguard
  namespace: agentguard
  labels:
    app.kubernetes.io/name: agentguard
    app.kubernetes.io/managed-by: hath0r
    fargate: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentguard
        fargate: "true"
    spec:
      serviceAccountName: agentguard-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: agentguard
          image: 711387127111.dkr.ecr.us-east-1.amazonaws.com/agentguard@sha256:c6c39de61f49f531aa1cd2790a89e1f0c337ea4b62bed9b3705b3e5b72a80bc3
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp-volume
          emptyDir: {}
